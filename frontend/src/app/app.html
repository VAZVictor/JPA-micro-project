<div class="app-shell">
  <app-sidebar [activeView]="activeView()" (viewChange)="setView($event)" />

  <main class="workspace" id="home">
    <header class="topbar">
      <div class="breadcrumb">SoundVault <span>/</span> {{ viewLabel() }}</div>
      <div class="topbar-right">
        <span class="demo-badge"><span class="status-dot"></span>DEMO</span>
        <span class="top-avatar" aria-hidden="true">AM</span>
      </div>
    </header>

    <div class="page-content">
      <app-page-heading
        [title]="pageTitle()"
        [description]="pageDescription()"
        [searchTerm]="searchTerm()"
        (searchChange)="updateSearch($event)"
      />

      @switch (activeView()) {
        @case ('overview') {
          <app-overview-page
            [tracks]="filteredTracks()"
            [playlists]="filteredPlaylists()"
            [totalTrackCount]="tracks().length"
            [totalPlaylistCount]="playlists().length"
            [favoriteCount]="favoriteCount()"
            (navigate)="setView($event)"
          />
        }
        @case ('tracks') {
          <section class="library-card">
            <div class="section-heading">
              <div><p class="eyebrow">DEINE SAMMLUNG</p><h2>{{ filteredTracks().length }} Tracks</h2></div>
              <span class="sort-label">TITEL</span>
            </div>
            <app-track-list [tracks]="filteredTracks()" />
          </section>
        }
        @case ('playlists') {
          <app-playlist-collection [playlists]="filteredPlaylists()" />
        }
      }

      <footer class="page-footer">
        <span>Mit Ruhe kuratiert.</span>
        <span>SoundVault <span class="footer-dot">·</span> Dein privater Musikraum</span>
      </footer>
    </div>
  </main>
</div>
